<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visible From</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJsZyIgeDE9IjAiIHkxPSIwIiB4Mj0iMSIgeTI9IjEiPjxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiMzYjgyZjYiLz48c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiMxZDRlZDgiLz48L2xpbmVhckdyYWRpZW50PjwvZGVmcz48cmVjdCB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHJ4PSI5IiBmaWxsPSJ1cmwoI2xnKSIvPjxjaXJjbGUgY3g9IjIyIiBjeT0iMTAiIHI9IjQiIGZpbGw9IiNmYmJmMjQiLz48cGF0aCBkPSJNMyAyNSBMMTIgMTEgTDE2LjUgMTcgTDIxIDkgTDI5IDI1IFoiIGZpbGw9IiNlZmY2ZmYiLz48cGF0aCBkPSJNMyAyNSBMMTIgMTEgTDE2LjUgMTcgTDEzLjcgMjEgTDkgMjUgWiIgZmlsbD0iI2JmZGJmZSIvPjxnIHN0cm9rZT0iI2ZiYmYyNCIgc3Ryb2tlLXdpZHRoPSIxLjQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCI+PHBhdGggZD0iTTEyIDExIEw4LjUgNi41Ii8+PHBhdGggZD0iTTEyIDExIEw0LjUgOC41IiBzdHJva2UtZGFzaGFycmF5PSIxLjYgMi4yIi8+PC9nPjwvc3ZnPg==">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      height: 100vh;
      height: 100dvh; /* accounts for mobile Safari's collapsing address bar,
                         so content never ends up hidden below the fold */
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: #f0f0f0;
    }

    /* ── Map ── */
    #map { flex: 1; }

    /* ── Side panel ── */
    /* Padding lives on #panel-inner, not #panel itself, so #top-progress-bar
       (a direct child of #panel) can sit flush at the very top edge without
       fighting the padding via negative margins – that combination (negative
       margin + position:sticky + an overflow:auto ancestor) is fragile and
       was rendering inconsistently in Safari on iPhone. */
    #panel {
      width: 216px;
      min-width: 216px;
      background: #fff;
      border-left: 1px solid #d1d5db;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    #panel-inner {
      display: flex;
      flex-direction: column;
      padding: 16px 10px;
      gap: 14px;
      flex: 1;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-row svg { flex-shrink: 0; }
    .brand-row h1 { white-space: nowrap; }

    .brand-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      align-self: flex-end;
      gap: 6px;
    }

    /* Live commit SHA, fetched from GitHub at load time – see terrain_app.js.
       Never baked in at "build" time (there is no build step), so it can
       never drift out of sync with what's actually deployed. */
    .app-version {
      font-size: 10px;
      font-family: monospace;
      color: #b0b5be;
      text-decoration: none;
    }
    .app-version:hover { text-decoration: underline; }

    .lang-toggle {
      display: flex;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .lang-toggle button {
      padding: 3px 7px;
      border: none;
      background: #f9fafb;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: #555;
    }
    .lang-toggle button.active { background: #1d4ed8; color: #fff; }

    h1 {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #111;
      line-height: 1.15;
    }
    h1 small {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: #888;
      margin-top: 2px;
    }

    /* On mobile, the download button and mode toggle sit side by side (each
       ~half width) so the essential controls fit in the very first row of
       the short bottom sheet, always visible without scrolling. On desktop
       display:contents makes this wrapper invisible to layout – its two
       children just stack normally as direct children of #panel, same as
       before this existed. */
    .dl-and-mode-row { display: contents; }

    /* Same idea for the peak dropdown + its coords/elevation readouts on
       mobile: select half-width, the two readouts stacked to its right. */
    .peak-select-row { display: contents; }
    .peak-info-col { display: contents; }

    /* Toggle rows */
    .mode-toggle {
      display: flex;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      overflow: hidden;
    }
    .mode-toggle button {
      flex: 1;
      padding: 7px 4px;
      border: none;
      background: #f9fafb;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      transition: background 0.15s, color 0.15s;
    }
    .mode-toggle button.active {
      background: #1d4ed8;
      color: #fff;
    }
    .mode-toggle button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Sections */
    .section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label.field-label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .coord-box {
      font-size: 12px;
      font-family: monospace;
      color: #374151;
      background: #f3f4f6;
      border-radius: 5px;
      padding: 5px 8px;
      min-height: 26px;
    }

    input[type="number"],
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      font-size: 13px;
      color: #111;
    }
    input:focus, textarea:focus { outline: 2px solid #93c5fd; border-color: #93c5fd; }
    input[readonly] {
      background: #f3f4f6;
      color: #374151;
      cursor: default;
    }
    input[readonly]:focus { outline: none; border-color: #d1d5db; }

    select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      font-size: 13px;
      color: #111;
      background: #fff;
    }
    select:focus { outline: 2px solid #93c5fd; border-color: #93c5fd; }

    .datetime-stack { display: flex; flex-direction: column; gap: 6px; }

    .wheel {
      position: relative;
      height: 32px;
      display: flex;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      scrollbar-width: none;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      cursor: grab;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
              mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
    }
    .wheel::-webkit-scrollbar { display: none; }
    .wheel.dragging { cursor: grabbing; scroll-snap-type: none; }
    .wheel:focus { outline: none; }
    .wheel:focus-visible { outline: 2px solid #93c5fd; outline-offset: 1px; }

    .wheel-item {
      flex: 0 0 auto;
      scroll-snap-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #b0b5be;
      font-variant-numeric: tabular-nums;
      user-select: none;
      transition: color 0.1s;
    }
    .wheel-item.selected { color: #111; font-weight: 700; font-size: 13px; }

    .hint {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.4;
    }

    /* Buttons */
    .btn {
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #1d4ed8; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1e40af; }
    .btn-danger  { background: #dc2626; color: #fff; }
    .btn-danger:hover  { background: #b91c1c; }

    /* Sticky, always-visible progress indicator for the currently running
       computation, pinned to the very top of #panel regardless of scroll
       position within it – a mid-panel bar could easily end up scrolled
       out of view, especially on the short mobile sheet. It's a direct
       child of #panel, sitting outside #panel-inner's padding entirely
       (rather than a padded child pulled flush via negative margins, which
       rendered inconsistently in Safari), so it needs no margin tricks.
       Transparent background so it's invisible (not just an empty grey
       track) whenever nothing's running. */
    #top-progress-bar {
      position: sticky;
      top: 0;
      height: 3px;
      flex-shrink: 0;
      background: transparent;
      overflow: hidden;
      z-index: 50;
      border-radius: 14px 14px 0 0;
    }
    #top-progress-fill {
      height: 100%;
      width: 0%;
      background: #1d4ed8;
      transition: width 0.25s;
    }
    #status {
      font-size: 11px;
      color: #6b7280;
      line-height: 1.4;
      min-height: 30px;
    }

    .tile-dl-status-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tile-dl-status {
      font-size: 11px;
      color: #6b7280;
    }
    .tile-dl-check {
      color: #16a34a;
      font-weight: 700;
      font-size: 14px;
    }

    /* First-visit callout pointing at "Download Elevation Data" – lives
       outside #panel in the DOM (see body markup) and uses position:fixed
       so it floats over the map instead of taking flow space in the menu,
       and isn't clipped by #panel's own overflow-y:auto scroll boundary.
       top/right (desktop) or bottom/left (mobile) are set at runtime by
       positionOnboardingBubble() in terrain_app.js, which measures the
       actual button position via getBoundingClientRect() so the arrow
       genuinely points at it instead of a guessed offset – the values
       below are just an unpositioned-first-paint fallback. Semi-
       transparent + blurred like a typical first-run coachmark, not a
       solid opaque tooltip.
       Desktop: sits left of the sidebar, arrow pointing right at the button.
       Mobile (media query below): sits above the bottom sheet, arrow down. */
    .onboarding-bubble {
      position: fixed;
      top: 96px;
      right: 230px;
      width: 270px;
      z-index: 1800;
      background: rgba(29, 78, 216, 0.86);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      padding: 16px 36px 16px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      box-shadow: 0 10px 28px rgba(29,78,216,0.4);
      animation: onboarding-pop 0.3s ease;
    }
    .onboarding-bubble-arrow {
      position: absolute;
      top: 24px;
      right: -10px;
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 10px solid rgba(29, 78, 216, 0.86);
    }
    .onboarding-bubble-close {
      position: absolute;
      top: 4px;
      right: 6px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.8);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 6px;
    }
    .onboarding-bubble-close:hover { color: #fff; }
    @keyframes onboarding-pop {
      from { transform: scale(0.9); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    @media (max-width: 700px) {
      .onboarding-bubble {
        top: auto;
        right: 16px;
        left: 16px;
        /* clears both the sheet's top edge and the pull-tab that sits there */
        bottom: calc(var(--panel-h) + 40px);
        width: auto;
      }
      .onboarding-bubble-arrow {
        top: auto;
        bottom: -10px;
        right: auto;
        left: 24px;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 10px solid rgba(29, 78, 216, 0.86);
        border-bottom: none;
      }
    }

    /* The download button doubles as its own progress bar – a gradient
       fill sweeping left to right via the --dl-progress custom property
       (set from JS), instead of a separate progress-bar element. Saves a
       row of height, which matters most on the short mobile sheet.
       It's `disabled` (and hence dimmed by the generic .btn:disabled rule)
       both while actively downloading AND once done, but those need to
       look different: full opacity while downloading so the gradient fill
       stays legible, dimmed once done to signal "nothing left to do here".
       The ID beats the generic class rule's specificity either way. */
    #btn-download-tiles {
      background: linear-gradient(to right, #1e40af var(--dl-progress, 0%), #1d4ed8 var(--dl-progress, 0%));
      transition: background 0.15s linear;
    }
    #btn-download-tiles.downloading { opacity: 1; cursor: progress; }
    #btn-download-tiles.tiles-ready { opacity: 0.55; cursor: not-allowed; }

    /* Legend – shown as a Leaflet control over the map's top-right corner
       (see terrain_app.js) instead of a sidebar section, so it's visible
       right next to the overlay it describes regardless of panel state.
       pointer-events:none so it never intercepts map clicks (which would
       otherwise re-select a peak under it in visibility mode). */
    .map-legend {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.92);
      padding: 6px 10px;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      font-size: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #374151;
      pointer-events: none;
    }
    .map-legend-swatch {
      width: 18px;
      height: 11px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    /* Footer */
    #footer {
      margin-top: auto;
      font-size: 10px;
      color: #b0b5be;
      line-height: 1.5;
    }
    #footer a { color: #b0b5be; }
    #footer button#btn-feedback {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      color: #b0b5be;
      text-decoration: underline;
      cursor: pointer;
    }
    #footer button#btn-feedback:hover { color: #1d4ed8; }

    /* Feedback modal – submits via FormSubmit.co's AJAX endpoint, no
       backend of our own needed. */
    .feedback-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .feedback-modal {
      position: relative;
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .feedback-modal h2 {
      font-size: 18px;
      margin-bottom: 12px;
      padding-right: 20px;
    }
    .feedback-modal-close {
      position: absolute;
      top: 8px;
      right: 10px;
      background: none;
      border: none;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px 6px;
    }
    .feedback-modal-close:hover { color: #374151; }
    #feedback-form { display: flex; flex-direction: column; gap: 10px; }
    #feedback-message { resize: vertical; min-height: 90px; font-family: inherit; }
    #feedback-status { margin-top: 10px; font-size: 13px; text-align: center; display: none; }
    #feedback-status.success { color: #16a34a; display: block; }
    #feedback-status.error { color: #dc2626; display: block; }

    /* Mobile panel toggle: a small pull-tab centred at the bottom edge of
       the screen – chevron points down while open (tab sits at the sheet's
       top edge, tap to push it back down), and flips to point up once
       collapsed (tab sits at the screen's bottom edge, ready to pull the
       sheet up). Base rotate(90deg) turns the "<" path into "^"; the .open
       state's rotate(270deg) is the *total* rotation (not additive), which
       turns it into "v" instead. */
    #panel-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      position: fixed;
      left: 50%;
      bottom: env(safe-area-inset-bottom, 0px);
      transform: translateX(-50%);
      z-index: 1700;
      width: 48px;
      height: 30px;
      border-radius: 10px 10px 0 0;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.28);
      cursor: pointer;
      transition: bottom 0.25s ease, box-shadow 0.15s ease;
    }
    #panel-toggle:hover { box-shadow: 0 -2px 11px rgba(0,0,0,0.38); }
    #panel-toggle svg {
      width: 11px;
      height: 11px;
      color: #fff;
      transition: transform 0.25s ease;
      transform: rotate(90deg);
    }
    #panel-toggle.open svg { transform: rotate(270deg); }
    #panel-toggle.open { bottom: calc(var(--panel-h) + env(safe-area-inset-bottom, 0px)); }
    @media (max-width: 700px) {
      /* ~40% of the screen – enough that everything important fits without
         scrolling, while the map above stays clearly visible. */
      :root { --panel-h: min(40vh, 340px); }
      #panel-toggle { display: flex; }

      /* Slides up from the bottom, full width, capped height with its own
         scroll – the top portion of the map stays visible/pannable even
         with the sheet open. */
      #panel {
        position: fixed;
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--panel-h);
        width: auto;
        min-width: 0;
        z-index: 1500;
        border-radius: 14px 14px 0 0;
        box-shadow: 0 -2px 14px rgba(0,0,0,0.3);
        transform: translateY(100%);
        transition: transform 0.25s ease;
      }
      #panel.open { transform: translateY(0); }
      #panel-inner { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }

      /* Version SHA + DE/EN back on the same line as the title (right-
         aligned) instead of their own row below it, reclaiming that row's
         height – every bit counts in the ~1/3-height sheet. */
      .brand {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
      .brand-toolbar { align-self: center; }

      /* Download button + mode toggle side by side (each ~half width) so
         both are always visible in the very first row of the short sheet
         without needing to scroll. */
      .dl-and-mode-row {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        gap: 10px;
      }
      .dl-and-mode-row > #tile-dl-panel,
      .dl-and-mode-row > .mode-toggle {
        flex: 1 1 50%;
        min-width: 0;
      }
      /* .mode-toggle's own display:flex (row) is kept as-is here – Peak/Sun
         stay side by side rather than stacking, even in the narrower half
         width. */

      .peak-select-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .peak-select-row > select,
      .peak-select-row > .peak-info-col {
        flex: 1 1 50%;
        min-width: 0;
      }
      .peak-info-col {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

<div id="map"></div>

<button id="panel-toggle" class="open" onclick="togglePanel()" aria-label="Toggle panel">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<div id="onboarding-bubble" class="onboarding-bubble" style="display:none">
  <div class="onboarding-bubble-arrow"></div>
  <button type="button" class="onboarding-bubble-close" id="onboarding-bubble-close" onclick="dismissOnboarding()">&times;</button>
  <span id="onboarding-bubble-text"></span>
</div>

<div id="panel" class="open">

  <div id="top-progress-bar"><div id="top-progress-fill"></div></div>

  <div id="panel-inner">

  <div class="brand">
    <div class="brand-row">
      <svg width="34" height="34" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="9" fill="url(#logoBg)"/>
        <circle cx="22" cy="10" r="4" fill="#fbbf24"/>
        <path d="M3 25 L12 11 L16.5 17 L21 9 L29 25 Z" fill="#eff6ff"/>
        <path d="M3 25 L12 11 L16.5 17 L13.7 21 L9 25 Z" fill="#bfdbfe"/>
        <g stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round">
          <path d="M12 11 L8.5 6.5"/>
          <path d="M12 11 L4.5 8.5" stroke-dasharray="1.6 2.2"/>
        </g>
      </svg>
      <h1>Visible From</h1>
    </div>
    <div class="brand-toolbar">
      <a id="app-version" class="app-version" href="https://github.com/manuelmurbach/visible-from/commits/main" target="_blank" rel="noopener"></a>
      <div class="lang-toggle" id="lang-toggle">
        <button type="button" data-lang="de" onclick="setLang('de')">DE</button>
        <button type="button" data-lang="en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </div>

  <div class="dl-and-mode-row">
    <!-- Persistent tile-download panel -->
    <div class="section" id="tile-dl-panel">
      <button class="btn btn-primary" id="btn-download-tiles" onclick="downloadElevationData()">
        Download Elevation Data
      </button>
      <div class="tile-dl-status-row">
        <span class="tile-dl-status" id="tile-dl-status">Tiles cached: 0</span>
        <span id="tile-dl-check" class="tile-dl-check" style="display:none">✓</span>
      </div>
    </div>

    <!-- Mode toggle -->
    <div class="mode-toggle">
      <button id="btn-visibility" class="active" onclick="setMode('visibility')">
        <strong>Peak</strong> Visible From
      </button>
      <button id="btn-shadow" onclick="setMode('shadow')">
        <strong>Sun</strong> Visible From
      </button>
    </div>
  </div>

  <!-- ── Visibility section ── -->
  <div class="section" id="section-vis" style="display:flex">
    <label class="field-label" id="label-pick-peak">Click the map, or pick a peak</label>
    <div class="peak-select-row">
      <select id="peak-select" onchange="selectPreset(this.value)">
        <option value="" disabled selected id="peak-select-placeholder">Choose a peak…</option>
        <option value="__map_click__" disabled id="peak-select-mapclick" style="display:none">Clicked on map</option>
        <option value="dufourspitze">Dufourspitze</option>
        <option value="matterhorn">Matterhorn</option>
        <option value="bachtel">Bachtel</option>
        <option value="montblanc">Mont Blanc</option>
        <option value="todi">Tödi</option>
        <option value="vrenelisgartli">Vrenelisgärtli</option>
        <option value="uetliberg">Uetliberg</option>
        <option value="pizbernina">Piz Bernina</option>
        <option value="eiger">Eiger</option>
      </select>
      <div class="peak-info-col">
        <div class="coord-box" id="vis-coords">No peak selected</div>
        <input type="text" id="peak-elev" placeholder="Elevation…" readonly>
      </div>
    </div>
  </div>

  <!-- ── Shadow section ── -->
  <div class="section" id="section-shad" style="display:none">
    <label class="field-label" id="label-datetime">Date &amp; Time (your local time)</label>
    <div class="datetime-stack">
      <div class="wheel" id="date-wheel" tabindex="0"></div>
      <div class="wheel" id="time-wheel" tabindex="0"></div>
    </div>
    <p class="hint" id="wheel-hint">Swipe, drag or scroll a wheel to change it. Double-tap/click to jump to now.</p>
  </div>

  <!-- Progress -->
  <div class="section">
    <div id="status"></div>
    <button class="btn btn-danger" id="btn-cancel"
            style="display:none" onclick="cancelComputation()">
      Cancel
    </button>
  </div>

  <button class="btn btn-danger" id="btn-clear-overlay" onclick="clearOverlayManually()">
    Clear Overlay
  </button>

  <div id="footer">
    <span id="footer-elevation-label">Elevation:</span>
    <a href="https://registry.opendata.aws/terrain-tiles/" target="_blank">Terrarium DEM</a>
    (AWS Open Data) &middot;
    <span id="footer-basemap-label">Basemap:</span> &copy; <a href="https://www.swisstopo.admin.ch" target="_blank">swisstopo</a>
    / &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>
    &middot; <button type="button" id="btn-feedback" onclick="openFeedbackModal()">Feedback</button>
  </div>

  </div><!-- #panel-inner -->

</div><!-- #panel -->

<div id="feedback-modal" class="feedback-modal-backdrop" style="display:none" onclick="if(event.target===this) closeFeedbackModal()">
  <div class="feedback-modal">
    <button type="button" class="feedback-modal-close" id="feedback-modal-close" onclick="closeFeedbackModal()">&times;</button>
    <h2 id="feedback-heading">Send Feedback</h2>
    <form id="feedback-form" onsubmit="submitFeedback(event)">
      <textarea id="feedback-message" placeholder="Your message…" required rows="4"></textarea>
      <input type="email" id="feedback-email" placeholder="Your email (optional, so I can reply)">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <button type="submit" class="btn btn-primary" id="feedback-submit-btn">Send</button>
    </form>
    <div id="feedback-status"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
<script src="terrain_app.js"></script>
